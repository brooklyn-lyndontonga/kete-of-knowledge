services:
  # 1. The Backend API (Node.js + SQLite)
  - type: web
    name: kete-server
    env: docker
    dockerContext: .
    dockerfilePath: clean/server/Dockerfile
    plan: free
    # One persistent disk holds BOTH the database and uploaded media.
    # Previously only /app/db was on the disk, so every redeploy wiped
    # all admin-uploaded PDFs/images/videos.
    disk:
      name: kete-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
      - key: SQLITE_DB_PATH
        value: /app/data/db/database.db
      - key: UPLOADS_DIR
        value: /app/data/uploads
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: APP_JWT_SECRET
        generateValue: true
      # Lock CORS to the deployed admin panel URL after first deploy,
      # e.g. https://kete-admin.onrender.com
      - key: ALLOWED_ORIGINS
        sync: false
      # EMAIL SERVICE (Required for Magic Links + password resets)
      # Set real SMTP credentials in the Render dashboard (marked sync: false
      # so they are never stored in this file).
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_FROM
        sync: false
      # Admin seed account — set in dashboard, then change the password
      # via the panel and remove these vars.
      - key: ADMIN_SEED_EMAIL
        sync: false
      - key: ADMIN_SEED_PASSWORD
        sync: false

  # 2. The Admin Panel (React/Vite)
  - type: static
    name: kete-admin
    env: static
    buildCommand: cd clean/admin && npm install && npm run build
    staticPublishPath: clean/admin/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: kete-server
          property: url

version: "1"
