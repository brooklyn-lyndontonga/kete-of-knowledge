version: '3.8'

services:
  server:
    build:
      context: ..
      dockerfile: clean/server/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
    env_file:
      - ./server/.env
    volumes:
      - sqlite_data:/app/db

  admin:
    build:
      context: ./admin
      args:
        - VITE_API_URL=http://localhost:3000
    ports:
      - "8080:80"
    depends_on:
      - server

volumes:
  sqlite_data:
